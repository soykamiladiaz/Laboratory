function pgFase(f){
  return `<div class="eyebrow" style="color:${PHC[f.id]}">Fase ${f.num} · ${esc(f.semanas)}</div>
  <h1 class="ph">${esc(f.titulo)}</h1>
  <p class="psub">${esc(f.sub)}</p>
  <div class="card" style="border-left:3px solid ${PHC[f.id]}">
    <div class="lab" style="margin-top:0">Objetivo</div><div>${esc(f.objetivo)}</div>
    <div class="lab">Principio</div><div style="color:var(--ink-soft)">${esc(f.principio)}</div>
  </div>
  <div class="bar" style="margin:18px 0 4px"><i id="bar-${f.id}" style="width:0;background:${PHC[f.id]}"></i></div>
  <div style="font-size:12.5px;color:var(--ink-faint)" id="cnt-${f.id}"></div>
  <div style="margin-top:16px">${f.actividades.map(a=>actHTML(a,f)).join('')}</div>
  <div class="card"><div class="lab" style="margin-top:0">Cómo sé que puedo pasar a la siguiente fase</div>
  <ul class="plain">${f.metricas.map(m=>'<li>'+esc(m)+'</li>').join('')}</ul></div>`;
}
function pgHabitos(){
  return `<div class="eyebrow">Transversal · las 12 semanas</div><h1 class="ph">Hábitos de soporte</h1>
  <p class="psub">Estos no son extras. Son las condiciones fisiológicas que hacen que todo lo demás sea posible.</p>
  ${DATA.habitos.map(h=>`<div class="card"><h3 style="font-size:17px">${esc(h.titulo)}</h3>
    <div class="tags" style="margin-top:7px"><span class="tag">${esc(h.marco)}</span></div>
    <div class="lab">Por qué</div><div class="why">${esc(h.porque)}</div>
    <div class="lab">Cómo</div><ol class="steps">${h.pasos.map(p=>'<li>'+esc(p)+'</li>').join('')}</ol></div>`).join('')}`;
}
function pgCronograma(){
  return `<div class="eyebrow">Estructura</div><h1 class="ph">Cronograma de 12 semanas</h1>
  <p class="psub">Una ruta, no una cárcel. Si una semana se cae, retomas donde estabas: no reinicias.</p>
  <div class="card" style="padding:6px 10px"><table><thead><tr><th>Sem</th><th>Fase</th><th>Foco de la semana</th><th>Al terminar</th></tr></thead>
  <tbody>${DATA.cronograma.map(r=>`<tr><td><span class="wk">${r[0]}</span></td><td style="font-size:13px;color:var(--ink-faint);font-weight:600">${esc(r[1])}</td><td>${esc(r[2])}</td><td style="color:var(--ink-soft);font-size:13.5px">${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`;
}
function pgMetricas(){
  return `<div class="eyebrow">Seguimiento</div><h1 class="ph">Métricas y escalas</h1>
  <p class="psub">${esc(DATA.escalasIntro)}</p>
  <div class="card">
    <h3 style="font-size:17px">Escala de autoestima de Rosenberg</h3>
    <p style="color:var(--ink-soft);font-size:14px;margin:7px 0 0">10 ítems. Responde según cómo te sientes habitualmente: 4 = muy de acuerdo · 3 = de acuerdo · 2 = en desacuerdo · 1 = muy en desacuerdo. Rango 10–40. Por debajo de 25 se considera autoestima baja; 26–29 media; 30 o más, alta.</p>
    <div class="tabs" id="rsesTabs">
      <button data-w="1" class="on">Semana 1</button><button data-w="6">Semana 6</button><button data-w="12">Semana 12</button>
    </div>
    <div id="rsesBody"></div>
    <div class="score"><div><div class="n" id="rsesScore">—</div><div style="font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700">Puntaje</div></div>
      <div id="rsesInterp" style="font-size:14px;color:var(--ink-soft);flex:1"></div></div>
    <svg class="spark" id="rsesSpark" viewBox="0 0 400 110" preserveAspectRatio="none"></svg>
  </div>
  <div class="card">
    <h3 style="font-size:17px">Indicadores conductuales semanales</h3>
    <p style="color:var(--ink-soft);font-size:14px;margin:7px 0 0">Los domingos, 20 minutos. Estos números son más honestos que la sensación.</p>
    <div class="tabs" id="wkTabs">${Array.from({length:12},(_,i)=>`<button data-w="${i+1}" class="${i===0?'on':''}">S${i+1}</button>`).join('')}</div>
    <div id="wkBody"></div>
  </div>
  <div class="card"><h3 style="font-size:17px">Qué mide cada indicador</h3>
  <table><thead><tr><th>Indicador</th><th>Qué cuenta</th><th>Dirección esperada</th></tr></thead>
  <tbody>${DATA.indicadores.map(i=>`<tr><td style="font-weight:600">${esc(i[0])}</td><td style="color:var(--ink-soft)">${esc(i[1])}</td><td style="font-size:13.5px">${esc(i[2])}</td></tr>`).join('')}</tbody></table></div>`;
}
function pgPlantillas(){
  return `<div class="eyebrow">Herramientas</div><h1 class="ph">Plantillas de registro</h1>
  <p class="psub">Cópialas a tu cuaderno o escribe directamente aquí. Cada entrada queda guardada con su fecha.</p>
  ${DATA.plantillas.map((t,i)=>`<div class="card">
    <h3 style="font-size:17px">${esc(t.titulo)}</h3>
    <ul class="tpl-fields" style="margin-top:9px">${t.campos.map(c=>'<li>'+esc(c)+'</li>').join('')}</ul>
    <div class="lab">Nueva entrada</div>
    <textarea rows="4" id="tplIn-${i}" placeholder="Escribe aquí siguiendo los campos de arriba…"></textarea>
    <div class="btnrow"><button class="btn sm" onclick="tplAdd(${i})">Guardar entrada</button></div>
    <div id="tplList-${i}" style="margin-top:12px"></div></div>`).join('')}`;
}
function pgAnexo(){
  return `<div class="eyebrow">Respaldo</div><h1 class="ph">Anexo teórico</h1>
  <p class="psub">De dónde viene cada técnica y qué dice la evidencia. Para que sepas que no estás haciendo cosas al azar.</p>
  <div class="callout"><b>Sobre las afirmaciones positivas.</b> ${esc(DATA.advertenciaAfirmaciones)}</div>
  ${DATA.anexo.map(m=>`<div class="card"><h3 style="font-size:16.5px">${esc(m.marco)}</h3>
    <div class="lab">Qué usa este plan de aquí</div><div>${esc(m.usa)}</div>
    <div class="lab">Evidencia</div><div class="why">${esc(m.evidencia)}</div></div>`).join('')}
  <div class="card"><h3 style="font-size:17px">Fuentes consultadas</h3>
  <ol style="padding-left:20px;font-size:13.5px;line-height:1.7;margin:10px 0 0">
  ${DATA.fuentes.map(f=>`<li style="margin-bottom:5px"><a href="${esc(f[1])}" target="_blank" rel="noopener">${esc(f[0])}</a></li>`).join('')}
  </ol></div>
  <div class="callout warnbox"><b>Recordatorio.</b> ${esc(DATA.aviso)}</div>`;
}
function pgDatos(){
  return `<div class="eyebrow">Respaldo</div><h1 class="ph">Mis datos</h1>
  <p class="psub">Todo se guarda solo en este navegador y en este computador. Nada viaja a ningún servidor.</p>
  <div class="card"><h3 style="font-size:17px">Respaldo</h3>
  <p style="color:var(--ink-soft);font-size:14px">Descarga un archivo con tu progreso, notas, escalas, entradas y evidencia. Guárdalo donde quieras y restáuralo cuando lo necesites.</p>
  <div class="btnrow">
    <button class="btn" onclick="exportAll()">Descargar respaldo</button>
    <button class="btn ghost" onclick="document.getElementById('impFile').click()">Restaurar desde archivo</button>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importAll(this)">
    <button class="btn ghost" onclick="window.print()">Imprimir / guardar como PDF</button>
  </div></div>
  <div class="card"><h3 style="font-size:17px">Empezar de cero</h3>
  <p style="color:var(--ink-soft);font-size:14px">Borra todo el progreso, notas y evidencia. No se puede deshacer.</p>
  <div class="btnrow"><button class="btn ghost" style="color:var(--warn);border-color:var(--warn)" onclick="wipe()">Borrar todos mis datos</button></div></div>
  <div class="card"><h3 style="font-size:17px">Resumen actual</h3><div id="resumen"></div></div>`;
}

/* ============ montaje ============ */
function render(){
  const m=document.getElementById('main');
  const P=[['inicio',pgInicio()],...DATA.fases.map(f=>[f.id,pgFase(f)]),
    ['habitos',pgHabitos()],['cronograma',pgCronograma()],['metricas',pgMetricas()],
    ['plantillas',pgPlantillas()],['anexo',pgAnexo()],['datos',pgDatos()]];
  m.innerHTML=P.map(([id,html])=>`<section class="page" id="pg-${id}">${html}</section>`).join('');
  buildNav(); wire(); refresh();
  const h=(location.hash||'#inicio').slice(1);
  go(PAGES.some(p=>p.id===h)?h:'inicio');
}
function wire(){
  document.getElementById('main').addEventListener('click',e=>{
    const c=e.target.closest('[data-chk]');
    if(c){e.stopPropagation();const id=c.dataset.chk;const st=A(id);st.done=!st.done;
      st.date=st.done?new Date().toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):'';
      save();c.classList.toggle('on',st.done);document.getElementById('act-'+id).classList.toggle('done',st.done);
      refresh();if(st.done)toast('Práctica completada');return;}
    const t=e.target.closest('[data-toggle]');
    if(t){const el=document.getElementById('act-'+t.dataset.toggle);el.classList.toggle('open');
      if(el.classList.contains('open'))paintEv(t.dataset.toggle);return;}
    const d=e.target.closest('[data-drop]');
    if(d){pickFor=d.dataset.drop;document.getElementById('filepick').click();return;}
    const r=e.target.closest('[data-rm]');
    if(r){evDel(r.dataset.rm).then(()=>paintEv(r.dataset.act));return;}
  });
  document.getElementById('main').addEventListener('input',e=>{
    const n=e.target.dataset.notes;
    if(n){A(n).notes=e.target.value;save();const s=document.getElementById('sv-'+n);s.classList.add('show');
      clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('show'),1300);}
  });
  document.querySelectorAll('[data-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',async e=>{e.preventDefault();el.classList.remove('over');
      for(const f of e.dataTransfer.files) await evAdd(el.dataset.drop,f);
      paintEv(el.dataset.drop);toast('Evidencia guardada');});
  });
  document.getElementById('filepick').onchange=async function(){
    for(const f of this.files) await evAdd(pickFor,f);
    this.value='';paintEv(pickFor);toast('Evidencia guardada');};
  // escalas
  const rt=document.getElementById('rsesTabs');
  if(rt){rt.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    rt.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));paintRses(b.dataset.w);};
    paintRses('1');}
  const wt=document.getElementById('wkTabs');
  if(wt){wt.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    wt.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));paintWeek(b.dataset.w);};
    paintWeek('1');}
  DATA.plantillas.forEach((_,i)=>paintTpl(i));
  paintResumen();
}
let pickFor=null;

async function paintEv(id){
  const box=document.getElementById('evs-'+id); if(!box)return;
  const list=await evList(id);
  box.innerHTML=list.map(f=>{
    const isImg=(f.type||'').startsWith('image/');
    const url=isImg?URL.createObjectURL(f.blob):'';
    const icon=(f.type||'').startsWith('audio')?'🎧':((f.type||'').includes('pdf')?'📄':'📎');
    return `<div class="ev">${isImg?`<img src="${url}">`:`<div class="fx">${icon}</div>`}
      <div class="nm" title="${esc(f.name)}">${esc(f.name)}</div>
      <button class="rm" data-rm="${f.id}" data-act="${id}" title="Eliminar">×</button></div>`;}).join('')
    || '<div style="font-size:12.5px;color:var(--ink-faint)">Sin evidencia todavía.</div>';
}

/* ---- Rosenberg ---- */
function paintRses(w){
  const cur=(S.rses[w]||[]);
  document.getElementById('rsesBody').innerHTML=DATA.rses.map((q,i)=>`<div class="q">
    <div class="qt">${i+1}. ${esc(q[0])}${q[1]?' <span style="color:var(--ink-faint);font-size:12px">(inverso)</span>':''}</div>
    <div class="opts">${[4,3,2,1].map(v=>`<label><input type="radio" name="r${w}-${i}" value="${v}" ${cur[i]==v?'checked':''} onchange="setRses('${w}',${i},${v})"><span>${v}</span></label>`).join('')}</div></div>`).join('');
  scoreRses(w);
}
function setRses(w,i,v){ if(!S.rses[w])S.rses[w]=[]; S.rses[w][i]=v; save(); scoreRses(w); }
function scoreRses(w){
  const cur=S.rses[w]||[];const full=cur.filter(x=>x).length===10;
  let s=0; DATA.rses.forEach((q,i)=>{const v=cur[i];if(v)s+=q[1]?(5-v):v;});
  document.getElementById('rsesScore').textContent=full?s:(cur.filter(x=>x).length+'/10');
  document.getElementById('rsesInterp').textContent=full
    ? (s<26?'Rango de autoestima baja. Es un punto de partida, no un veredicto: es exactamente lo que este plan trabaja.'
      : s<30?'Rango medio. Hay base sobre la que construir; el trabajo está en la estabilidad ante el error y el rechazo.'
      : 'Rango alto. Cuida que no dependa de logros o de la aprobación externa — ahí es donde la autocompasión sostiene.')
    : 'Responde los 10 ítems para ver tu puntaje.';
  sparkRses();
}
function sparkRses(){
  const svg=document.getElementById('rsesSpark');if(!svg)return;
  const pts=['1','6','12'].map(w=>{const c=S.rses[w]||[];if(c.filter(x=>x).length<10)return null;
    let s=0;DATA.rses.forEach((q,i)=>s+=q[1]?(5-c[i]):c[i]);return s;});
  const have=pts.filter(p=>p!==null).length;
  if(have<1){svg.innerHTML='<text x="200" y="58" text-anchor="middle" fill="var(--ink-faint)" font-size="12" font-family="sans-serif">Completa la escala para ver tu curva</text>';return;}
  const X=[40,200,360], y=v=>100-((v-10)/30)*82;
  let path='',dots='',labs='';
  pts.forEach((v,i)=>{ if(v===null)return;
    path+=(path?'L':'M')+X[i]+' '+y(v).toFixed(1)+' ';
    dots+=`<circle cx="${X[i]}" cy="${y(v).toFixed(1)}" r="4.5" fill="var(--accent)"/>`;
    labs+=`<text x="${X[i]}" y="${(y(v)-11).toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="700" font-family="sans-serif">${v}</text>`;});
  const axis=X.map((x,i)=>`<text x="${x}" y="108" text-anchor="middle" fill="var(--ink-faint)" font-size="10" font-family="sans-serif">Sem ${['1','6','12'][i]}</text>`).join('');
  svg.innerHTML=`<line x1="20" y1="${y(26)}" x2="380" y2="${y(26)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="382" y="${y(26)+3}" fill="var(--ink-faint)" font-size="9" font-family="sans-serif">26</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>${dots}${labs}${axis}`;
}

/* ---- indicadores semanales ---- */
const WKF=[['limites','Límites puestos'],['retract','Retractaciones'],['impulsos','Impulsos no actuados'],
  ['recup','Tiempo de recuperación (min)'],['practica','Días de práctica (0–7)'],['critica','Autocrítica destructiva (0–10)'],
  ['cred','Credibilidad creencia nueva (0–100)']];
function paintWeek(w){
  const d=S.week[w]||{};
  document.getElementById('wkBody').innerHTML=`<div class="grid2" style="margin-top:12px">
    ${WKF.map(f=>`<div><div class="lab" style="margin:0 0 4px">${f[1]}</div>
      <input type="number" value="${d[f[0]]??''}" onchange="setWeek('${w}','${f[0]}',this.value)"></div>`).join('')}
    </div><div class="lab">Nota de la semana</div>
    <textarea rows="3" onchange="setWeek('${w}','nota',this.value)" placeholder="El momento más coherente conmigo esta semana fue…">${esc(d.nota||'')}</textarea>`;
}
function setWeek(w,k,v){ if(!S.week[w])S.week[w]={}; S.week[w][k]=v; save(); paintResumen(); }

/* ---- plantillas ---- */
function tplAdd(i){
  const ta=document.getElementById('tplIn-'+i); const v=ta.value.trim(); if(!v)return;
  if(!S.tpl[i])S.tpl[i]=[];
  S.tpl[i].unshift({d:new Date().toLocaleString('es-CO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),t:v});
  save(); ta.value=''; paintTpl(i); toast('Entrada guardada');
}
function tplDel(i,j){ S.tpl[i].splice(j,1); save(); paintTpl(i); }
function paintTpl(i){
  const box=document.getElementById('tplList-'+i); if(!box)return;
  const l=S.tpl[i]||[];
  box.innerHTML=l.length?l.map((e,j)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:8px;background:var(--bg)">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <span style="font-size:11.5px;color:var(--ink-faint);font-weight:600">${esc(e.d)}</span>
      <button class="btn ghost sm" onclick="tplDel(${i},${j})">Borrar</button></div>
    <div style="white-space:pre-wrap;font-size:14px;margin-top:6px">${esc(e.t)}</div></div>`).join('')
    :'<div style="font-size:12.5px;color:var(--ink-faint)">Todavía no hay entradas.</div>';
}

/* ---- resumen / progreso ---- */
function refresh(){
  const p=pct();
  document.getElementById('pctBig').textContent=p.p+'%';
  document.getElementById('barAll').style.width=p.p+'%';
  document.getElementById('subAll').textContent=p.d+' de '+p.t+' prácticas';
  const a=document.getElementById('stPct'),b=document.getElementById('stDone');
  if(a)a.textContent=p.p+'%'; if(b)b.textContent=p.d+'/'+p.t;
  DATA.fases.forEach(f=>{
    const d=f.actividades.filter(x=>A(x.id).done).length;
    const bar=document.getElementById('bar-'+f.id); const cnt=document.getElementById('cnt-'+f.id);
    if(bar)bar.style.width=Math.round(d/f.actividades.length*100)+'%';
    if(cnt)cnt.textContent=d+' de '+f.actividades.length+' prácticas de esta fase';
  });
  paintResumen();
}
async function paintResumen(){
  const el=document.getElementById('resumen'); if(!el)return;
  const p=pct(); const ev=await evAll();
  const nTpl=Object.values(S.tpl).reduce((a,b)=>a+b.length,0);
  const nWk=Object.keys(S.week).length;
  el.innerHTML=`<div class="grid2" style="margin-top:10px">
    <div class="stat"><div class="n">${p.d}/${p.t}</div><div class="t">Prácticas hechas</div></div>
    <div class="stat"><div class="n">${ev.length}</div><div class="t">Archivos de evidencia</div></div>
    <div class="stat"><div class="n">${nTpl}</div><div class="t">Entradas de registro</div></div>
    <div class="stat"><div class="n">${nWk}</div><div class="t">Semanas registradas</div></div></div>`;
}

/* ---- export / import ---- */
async function exportAll(){
  const ev=await evAll();
  const files=await Promise.all(ev.map(f=>new Promise(res=>{
    const r=new FileReader(); r.onload=()=>res({id:f.id,actId:f.actId,name:f.name,type:f.type,added:f.added,data:r.result});
    r.readAsDataURL(f.blob);})));
  const blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),state:S,files},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='respaldo-plan-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Respaldo descargado');
}
async function importAll(input){
  const f=input.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!j.state) throw 0;
    S=j.state; save();
    if(j.files&&j.files.length){
      for(const fl of j.files){ const b=await (await fetch(fl.data)).blob();
        await evAdd(fl.actId,new File([b],fl.name,{type:fl.type})); }
    }
    toast('Respaldo restaurado'); render();
  }catch(e){ toast('No pude leer ese archivo'); }
  input.value='';
}
function wipe(){
  if(!confirm('¿Borrar todo tu progreso, notas y evidencia? Esto no se puede deshacer.'))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  if(hasIDB){try{if(db){db.close();db=null;} indexedDB.deleteDatabase('plan-evidencia');}catch(e){}}
  S={act:{},rses:{},week:{},tpl:{},theme:S.theme}; save(); render(); toast('Datos borrados');
}

/* ---- tema ---- */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);S.theme=t;save();}
document.getElementById('themeBtn').onclick=()=>setTheme(S.theme==='dark'?'light':'dark');
setTheme(S.theme||'light');

render();
</script>
</body>
